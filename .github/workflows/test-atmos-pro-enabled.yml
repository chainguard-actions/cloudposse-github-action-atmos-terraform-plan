name: "Test - Atmos Pro Enabled"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The fully-formed ref of the branch or tag that triggered the workflow run"
        required: false
        type: "string"
      sha:
        description: "The sha of the commit that triggered the workflow run"
        required: false
        type: "string"
  pull_request:
    types: [opened, synchronize, reopened]

env:
  AWS_REGION: us-east-2

# Permissions required for assuming AWS identity
permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo "Do setup"

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [setup]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TERRAFORM_STATE_TABLE: ${{ secrets.TERRAFORM_STATE_TABLE }}
          TERRAFORM_STATE_ROLE: ${{ secrets.TERRAFORM_STATE_ROLE }}
          TERRAFORM_PLAN_ROLE: ${{ secrets.TERRAFORM_PLAN_ROLE }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cp ./tests/terraform/atmos.yaml "$RUNNER_TEMP/atmos.yaml"
          sed -i -e 's#__INFRACOST_ENABLED__#false#g' "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_REGION__#${AWS_REGION_VAL}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_BUCKET__#${TERRAFORM_STATE_BUCKET}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_ROLE__#${TERRAFORM_STATE_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__PLAN_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__APPLY_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"

          for file in ./tests/terraform/stacks/catalog/*.yaml; do
          if [ -f "$file" ]; then
            sed -i -e "s#__INFRACOST_ENABLED__#false#g" "$file"
            sed -i -e "s#__STORAGE_REGION__#${AWS_REGION_VAL}#g" "$file"          
            sed -i -e "s#__STORAGE_BUCKET__#${TERRAFORM_STATE_BUCKET}#g" "$file"
            sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$file"          
            sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$file"
            sed -i -e "s#__STORAGE_ROLE__#${TERRAFORM_STATE_ROLE}#g" "$file"
            sed -i -e "s#__PLAN_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$file"
            sed -i -e "s#__APPLY_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$file"
          fi
          done
          
          cat "$RUNNER_TEMP/atmos.yaml"

      - name: Plan Atmos Pro Component
        id: current
        uses: ./
        with:
          component: "foobar-atmos-pro"
          stack: "plat-ue2-sandbox"
          sha: ${{ github.sha }}
          atmos-config-path: ${{ runner.temp }}
          atmos-version: ">= 1.174.0"
          skip-checkout: false

    outputs:
      result: ${{ steps.current.outcome }}
      summary: ${{ steps.current.outputs.summary }}

  assert:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          expected: 'success'
          actual: "${{ needs.test.outputs.result }}"

      - name: Display structure of downloaded files
        id: metadata
        run: |
          set +e
          
          test -d ./metadata
          DIR_EXISTS=$?
          echo "dir_exists=${DIR_EXISTS}" >> $GITHUB_OUTPUT

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ steps.metadata.outputs.dir_exists }}"
          expected: "1"

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ fromJSON(needs.test.outputs.summary) }}"
          expected: |
            ## Changes Found for `foobar-atmos-pro` in `plat-ue2-sandbox`
  
            <a href="https://cloudposse.com/"><img src="https://cloudposse.com/logo-300x69.svg" width="100px" align="right"/></a>
            [![create](https://shields.io/badge/PLAN-CREATE-success?style=for-the-badge)](#user-content-create-plat-ue2-sandbox-foobar-atmos-pro)
            
            
            
            <details><summary><a id="result-plat-ue2-sandbox-foobar-atmos-pro" />Plan: 1 to add, 0 to change, 0 to destroy.</summary>
            
            <br/>      
            To reproduce this locally, run:<br/><br/>
            
            ```shell
            atmos terraform plan foobar-atmos-pro -s plat-ue2-sandbox
            ```
                
            
            
                
            ---
            ### <a id="create-plat-ue2-sandbox-foobar-atmos-pro" />Create
            ```diff
            + random_id.foo[0]
            ```
                
            </details>
            
            <details><summary>Terraform <strong>Plan</strong> Summary</summary>
            
            ```hcl
            
              # random_id.foo[0] will be created
              + resource "random_id" "foo" {
                  + b64_std     = (known after apply)
                  + b64_url     = (known after apply)
                  + byte_length = 8
                  + dec         = (known after apply)
                  + hex         = (known after apply)
                  + id          = (known after apply)
                  + keepers     = {
                      + "seed" = "foo-plat-ue2-sandbox-blue"
                    }
                }
            
            Plan: 1 to add, 0 to change, 0 to destroy.
            ```
            
            </details>

  teardown:
    runs-on: ubuntu-latest
    needs: [assert]
    if: ${{ always() }}
    steps:
      - name: Tear down
        run: echo "Do Tear down" 
