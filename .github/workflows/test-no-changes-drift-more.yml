name: "Test - No changes - Drift mode"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The fully-formed ref of the branch or tag that triggered the workflow run"
        required: false
        type: "string"
      sha:
        description: "The sha of the commit that triggered the workflow run"
        required: false
        type: "string"
env:
  AWS_REGION: us-east-2

# Permissions required for assuming AWS identity
permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo "Do setup"

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [setup]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          AWS_REGION: ${{ env.AWS_REGION }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TERRAFORM_STATE_TABLE: ${{ secrets.TERRAFORM_STATE_TABLE }}
          TERRAFORM_STATE_ROLE: ${{ secrets.TERRAFORM_STATE_ROLE }}
          TERRAFORM_PLAN_ROLE: ${{ secrets.TERRAFORM_PLAN_ROLE }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cp ./tests/terraform/atmos.yaml "$RUNNER_TEMP/atmos.yaml"
          sed -i -e 's#__INFRACOST_ENABLED__#false#g' "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_REGION__#${AWS_REGION}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_BUCKET__#${TERRAFORM_STATE_BUCKET}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_ROLE__#${TERRAFORM_STATE_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__PLAN_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__APPLY_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$RUNNER_TEMP/atmos.yaml"

          for file in ./tests/terraform/stacks/catalog/*.yaml; do
          if [ -f "$file" ]; then
            sed -i -e "s#__INFRACOST_ENABLED__#false#g" "$file"
            sed -i -e "s#__STORAGE_REGION__#${AWS_REGION}#g" "$file"          
            sed -i -e "s#__STORAGE_BUCKET__#${TERRAFORM_STATE_BUCKET}#g" "$file"
            sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$file"          
            sed -i -e "s#__STORAGE_TABLE__#${TERRAFORM_STATE_TABLE}#g" "$file"
            sed -i -e "s#__STORAGE_ROLE__#${TERRAFORM_STATE_ROLE}#g" "$file"
            sed -i -e "s#__PLAN_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$file"
            sed -i -e "s#__APPLY_ROLE__#${TERRAFORM_PLAN_ROLE}#g" "$file"
          fi
          done

      - name: Plan Atmos Component
        id: current
        uses: ./
        with:
          component: "foobar"
          stack: "plat-ue2-sandbox"
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: true
          atmos-config-path: ${{ runner.temp }}
          skip-checkout: true

    outputs:
      result: ${{ steps.current.outcome }}
      summary: ${{ steps.current.outputs.summary }}

  assert:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          expected: 'success'
          actual: "${{ needs.test.outputs.result }}"

      - name: Sleep for 30 seconds
        uses: kibertoad/wait-action@99f6f101c5be7b88bb9b41c0d3b810722491b8e5 # 1.0.1
        with:
          time: '30s'
          
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: metadata
          pattern: metadata-*
          merge-multiple: true

      - name: Display structure of downloaded files
        id: metadata
        run: |
          set +e
          
          test -d ./metadata
          DIR_EXISTS=$?
          echo "dir_exists=${DIR_EXISTS}" >> $GITHUB_OUTPUT

          test -f ./metadata/plat-ue2-sandbox-foobar.metadata.json
          FILE_EXISTS=$?
          echo "file_exists=${FILE_EXISTS}" >> $GITHUB_OUTPUT
          
          test -f ./metadata/issue-description-plat-ue2-sandbox-foobar.md
          FILE_EXISTS=$?
          echo "file_md_exists=${FILE_EXISTS}" >> $GITHUB_OUTPUT
          
          echo "file_json=$(cat ./metadata/plat-ue2-sandbox-foobar.metadata.json | jq -Rs . )" >> $GITHUB_OUTPUT          
          

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ steps.metadata.outputs.dir_exists }}"
          expected: "0"

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ steps.metadata.outputs.file_exists }}"
          expected: "0"

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ steps.metadata.outputs.file_md_exists }}"
          expected: "1"

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ fromJSON(steps.metadata.outputs.file_json) }}"
          expected: |
            { "stack": "plat-ue2-sandbox", "component": "foobar", "componentPath": "tests/terraform/components/terraform/foobar", "drifted": false, "error": false }

      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          actual: "${{ fromJSON(needs.test.outputs.summary) }}"
          expected: ""

  teardown:
    runs-on: ubuntu-latest
    needs: [assert]
    if: ${{ always() }}
    steps:
      - name: Tear down
        run: echo "Do Tear down"
