name: Test - Actions Disabled (github-actions-enabled false)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'false'
          atmos-config-path: ${{ github.workspace }}/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          # When github-actions-enabled=false and atmos-pro-enabled=false,
          # the action skips the plan steps and should succeed (or fail gracefully
          # if atmos-get-setting cannot resolve the component/stack).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with actions disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when atmos config cannot resolve component/stack in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
