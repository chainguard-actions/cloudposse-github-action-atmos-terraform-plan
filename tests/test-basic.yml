name: Test basic usage - atmos settings with github-actions-enabled false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          component: mycomponent
          stack: example
          sha: ${{ github.sha }}
          atmos-config-path: >-
            ${{ github.workspace }}/actions/hardened/cloudposse--github-action-atmos-terraform-plan/v5.2.1/tests/fixtures/atmos-config
          skip-checkout: "true"
          plan-storage: "false"
          drift-detection-mode-enabled: "false"

      - name: Assert summary output exists
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          echo "PASS: action completed without error"
