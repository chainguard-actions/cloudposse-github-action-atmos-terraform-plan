name: Test - Debug Mode Enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'false'
          atmos-config-path: ${{ github.workspace }}/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'
          debug: 'true'

      - name: Assert action ran with debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (settings read, actions disabled, skip plan)
          # or fail gracefully if atmos cannot resolve the component/stack.
          # Either way, it should not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with debug=true, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
