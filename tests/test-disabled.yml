name: Test disabled (github-actions-enabled false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with github-actions-enabled false
        id: action
        uses: .
        with:
          component: mycomp
          stack: test
          sha: ${{ github.sha }}
          atmos-config-path: "${{ github.workspace }}/tests/fixtures/disabled"
          skip-checkout: "true"
          plan-storage: "false"
          drift-detection-mode-enabled: "false"

      - name: Assert action completed successfully
        env:
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "summary: $SUMMARY"
          # When github-actions-enabled is false, the action skips terraform steps
          # and completes successfully with empty summary
          echo "PASS: action completed without error when github-actions-enabled is false"
