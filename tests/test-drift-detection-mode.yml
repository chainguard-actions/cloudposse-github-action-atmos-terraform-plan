name: Test - Drift Detection Mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'true'
          atmos-config-path: ${{ github.workspace }}/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'

      - name: Assert action ran in drift detection mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          # With drift-detection-mode-enabled=true and github-actions-enabled=false,
          # the action should skip the plan steps and complete (success or graceful failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in drift detection mode, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
