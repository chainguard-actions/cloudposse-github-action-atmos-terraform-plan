name: Test - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'false'
          atmos-config-path: ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'
          infracost-api-key: 'test-infracost-key-placeholder'

      - name: Assert action ran with infracost-api-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUMMARY: ${{ steps.action.outputs.summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "summary: $SUMMARY"
          # The infracost-api-key input is accepted by the action.
          # Infracost itself only runs when atmos settings enable it and there are changes.
          # Under the harness, atmos config resolution may fail gracefully.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with infracost-api-key input, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
