name: Test - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'false'
          atmos-config-path: ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'
          infracost-api-key: 'test-infracost-api-key-value'

      - name: Assert action ran with infracost-api-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail gracefully depending on atmos config resolution.
          # The important thing is that the infracost-api-key input is accepted and the action
          # does not crash unexpectedly (e.g. with an unknown input error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with infracost-api-key input, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
