name: Test Atmos Terraform Plan - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run atmos terraform plan action with infracost-api-key input
        id: action
        uses: .
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          atmos-config-path: ${{ github.workspace }}/tests/fixtures/atmos-config
          drift-detection-mode-enabled: 'false'
          plan-storage: 'false'
          skip-checkout: 'true'
          token: ${{ github.token }}
          infracost-api-key: 'ic-test-key-placeholder'

      - name: Assert action completed (infracost not triggered when enable-infracost is false)
        env:
          ACTUAL_PLAN_FILE: ${{ steps.action.outputs.plan_file }}
          ACTUAL_HAS_CHANGES: ${{ steps.action.outputs.has-changes }}
        run: |
          echo "plan_file: $ACTUAL_PLAN_FILE"
          echo "has-changes: $ACTUAL_HAS_CHANGES"
          # When github-actions-enabled is false/not set, no plan runs and infracost is not triggered.
          # The infracost-api-key input is accepted without error.
          if [ -z "$ACTUAL_PLAN_FILE" ]; then
            echo "PASS: plan_file is empty as expected (github-actions-enabled=false)"
          else
            echo "INFO: plan_file has value: $ACTUAL_PLAN_FILE"
          fi
          if [ -z "$ACTUAL_HAS_CHANGES" ] || [ "$ACTUAL_HAS_CHANGES" = "false" ]; then
            echo "PASS: has-changes is empty or false as expected"
          else
            echo "FAIL: unexpected has-changes value: $ACTUAL_HAS_CHANGES"
            exit 1
          fi
          echo "PASS: infracost-api-key input accepted without error"
