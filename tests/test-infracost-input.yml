name: Test Atmos Terraform Plan - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infracost-api-key input provided
        id: action
        uses: .
        with:
          component: mycomp
          stack: test
          sha: ${{ github.sha }}
          atmos-config-path: "${{ github.workspace }}/tests/fixtures/no-changes"
          skip-checkout: "true"
          plan-storage: "false"
          drift-detection-mode-enabled: "false"
          pr-comment: "false"
          infracost-api-key: "ic-test-key-placeholder"

      - name: Assert action completed (infracost-api-key accepted as input)
        env:
          HAS_CHANGES: ${{ steps.action.outputs.has-changes }}
        run: |
          echo "has-changes: $HAS_CHANGES"
          echo "PASS: action accepted infracost-api-key input without error"
