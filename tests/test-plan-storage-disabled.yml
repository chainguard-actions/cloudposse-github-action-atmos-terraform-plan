name: Test - Plan Storage Disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          drift-detection-mode-enabled: 'false'
          atmos-config-path: ${{ github.workspace }}/tests/fixtures/atmos-config
          skip-checkout: 'true'
          plan-storage: 'false'

      - name: Assert plan-storage=false is accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PLAN_FILE: ${{ steps.action.outputs.plan_file }}
          PLAN_JSON: ${{ steps.action.outputs.plan_json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "plan_file: $PLAN_FILE"
          echo "plan_json: $PLAN_JSON"
          # With plan-storage=false and github-actions-enabled=false,
          # the action should skip both the plan and storage steps.
          # The plan_file and plan_json outputs should be empty.
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$PLAN_FILE" ]; then
              echo "FAIL: expected plan_file to be empty when github-actions-enabled=false"
              exit 1
            fi
            echo "PASS: plan_file is empty as expected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when atmos config cannot resolve component/stack)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
